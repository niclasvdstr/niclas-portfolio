<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niclas van der Straeten</title>
  <meta name="description" content="Buche ein kostenloses Erstgespräch, besuche VDSolutions oder nimm direkt Kontakt auf." />
  <link rel="preload" href="assets/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <main id="main" class="card">
    <header class="profile">
      <img class="avatar" src="assets/niclas-portrait.png" alt="Profilbild von Niclas van der Straeten"
           width="112" height="112"
           onerror="this.classList.add('avatar--fallback'); this.removeAttribute('src');" />
      <h1 class="name">Niclas van der Straeten</h1>
      <p class="bio">Founder <strong>@VDSolutions</strong> | KI-Beratung<br />KI-L&ouml;sungen &middot; Automatisierung &middot; Wachstum</p>

      <nav class="socials" aria-label="Social Media">
        <ul id="socials-list" class="socials-list"></ul>
      </nav>
    </header>

    <section class="link-section" aria-labelledby="business-heading">
      <h2 id="business-heading" class="section-label">
        <span class="section-label__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/></svg>
        </span>
        Für Unternehmen
      </h2>
      <ul id="main-links" class="links-list"></ul>
    </section>

    <section class="link-section" aria-labelledby="realestate-heading">
      <details class="disclosure">
        <summary class="disclosure-summary">
          <h2 id="realestate-heading" class="section-label">
            <span class="section-label__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
            </span>
            Für Immobilieneigentümer
          </h2>
          <span class="disclosure-summary__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </summary>
        <ul id="realestate-links" class="links-list disclosure__panel"></ul>
      </details>
    </section>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Niclas van der Straeten &middot; Frankfurt am Main</p>
      <p class="footer-legal">
        <a href="https://www.vanderstraeten-immobilien.de/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
        &nbsp;&middot;&nbsp;
        <a href="https://www.vanderstraeten-immobilien.de/datenschutz" target="_blank" rel="noopener noreferrer">Datenschutz</a>
      </p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
